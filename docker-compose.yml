services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # Soroban bounty contract deployed on Stellar Testnet (see docs/DEPLOYMENT.md)
      BOUNTY_CONTRACT_ID: ${BOUNTY_CONTRACT_ID:-CB4OI57YRKLAIX2RGFS7DX3GIGEST4MSI447VAJPRCBCNFUHWLWLQLWT}
      DEMO_TOKEN_ID: ${DEMO_TOKEN_ID:-CB7NFW2WD3FXKBYANZX7J3FO6PBST2H3IE6SPHXHSWIQESII2P2A6Y6P}
      CONTRIBUTOR_REGISTRY_ID: ${CONTRIBUTOR_REGISTRY_ID:-}
      BOUNTY_ADMIN_ADDRESS: ${BOUNTY_ADMIN_ADDRESS:-GB2OVPTEO2BYRRRRWNRPZZOC3VW77IQDXJPBY2WYV2MXSU7C5HQDZ6E6}
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      LOG_LEVEL: info
    volumes:
      - trr-data:/app/data/db
    expose:
      - "3001"

  frontend:
    build: .
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Observability — Prometheus scrapes backend /metrics; Grafana renders the
  # provisioned dashboard (monitoring/grafana/dashboards).
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"

volumes:
  trr-data:
  prom-data:
  grafana-data: