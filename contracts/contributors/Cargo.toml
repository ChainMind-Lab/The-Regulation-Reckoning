[package]
name = "regulation-reckoning-contributors"
version = "1.0.0"
edition = "2021"
description = "On-chain contributor reputation registry for The Regulation Reckoning (Stellar Testnet)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "27.0.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "27.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true