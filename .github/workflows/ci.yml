name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — format, lint, typecheck, build, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

  backend:
    name: Backend — format, lint, typecheck, build, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

  contracts:
    name: Contracts — Soroban fmt, clippy, tests, WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/bounty/target
          key: cargo-${{ hashFiles('contracts/bounty/Cargo.toml') }}

      - name: Format check
        working-directory: contracts/bounty
        run: cargo fmt --check

      - name: Clippy
        working-directory: contracts/bounty
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: contracts/bounty
        run: cargo test

      - name: Build release WASM
        working-directory: contracts/bounty
        run: cargo build --release --target wasm32v1-none